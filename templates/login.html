<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直播回放後台登入</title>
  {% include 'login_head.html' %}
</head>
<body>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-4">
            <div class="card mb-0">
              <div class="card-body">
                <a href="/" class="d-flex align-items-center justify-content-center py-3 w-100 text-reset"
                  style="text-decoration:none; color:inherit;">
                  <img src="/static/imgs/vf_logo.png" alt="" style="height:32px;width:auto;" class="me-2" />
                  <span class="fw-bold fs-5 d-inline-block">直播回放後台</span>
                </a>
                <p class="text-center">雙生紫焰</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ 'success' if category == 'success' else ('info' if category == 'info' else 'danger') }}" role="alert">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                <!-- 登入表單 -->
                <form method="POST" action="{{ url_for('login') }}">
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">使用者Email</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" name="username" value="{{ username or '' }}" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-4">
                    <label for="exampleInputPassword1" class="form-label">密碼</label>
                    <div class="input-group">
                      <input type="password" class="form-control" id="exampleInputPassword1" name="password">
                      <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <iconify-icon icon="mdi:eye" id="passwordIcon"></iconify-icon>
                      </button>
                    </div>
                  </div>
                  <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                      <input class="form-check-input primary" type="checkbox" value="1" id="flexCheckChecked" name="remember_me">
                      <label class="form-check-label text-dark" for="flexCheckChecked">
                        記住此裝置
                      </label>
                    </div>
                    <a class="text-primary fw-bold" href="/forgot-password">忘記密碼？</a>
                  </div>
                  <!-- Google reCAPTCHA widget -->
                  <div class="mb-4">
                    <div class="g-recaptcha" data-sitekey="{{ config.RECAPTCHA_SITE_KEY }}"></div>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-4">登入</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="/static/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <!-- Google reCAPTCHA script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('exampleInputPassword1');
      const passwordIcon = document.getElementById('passwordIcon');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordIcon.setAttribute('icon', isPassword ? 'mdi:eye-off' : 'mdi:eye');
    });
  </script>
</body>

</html>
