{% extends "admin_base.html" %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <h4 class="mb-2">使用者表 (user)</h4>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Email</th>
            <th>建立日期</th>
            <th>修改日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="user in pageData.userList" :key="user.id">
            <td>[[ user.id ]]</td>
            <td>[[ user.email ]]</td>
            <td>[[ user.created_at ]]</td>
            <td>[[ user.updated_at ]]</td>
            <td>
              <button class="btn btn-sm btn-primary">編輯</button>
              <button class="btn btn-sm btn-danger">刪除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
  function extendVue(app) {
    app.pageData = {
      userList: [
        { id: 1, email: 'user1@example.com', created_at: '2025-01-01', updated_at: '2025-01-02' },
        { id: 2, email: 'user2@example.com', created_at: '2025-02-01', updated_at: '2025-02-02' }
      ]
    };
  }
</script>
{% endblock %}
