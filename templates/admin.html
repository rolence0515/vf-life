<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeoDash Free Bootstrap Admin Template by Adminmart</title>
  <link rel="shortcut icon" type="image/png" href="/static/assets/images/logos/seodashlogo.png" />
  <link rel="stylesheet" href="/static/assets/css/styles.min.css" />
  <style>
    @media (max-width: 576px) {
      .sticky-play-mobile {
        position: sticky;
        right: 0;
        background: #fff;
        z-index: 2;
        box-shadow: -2px 0 4px rgba(0, 0, 0, 0.03);
      }

      .sticky-play-mobile-th {
        position: sticky;
        right: 0;
        background: #fff;
        z-index: 3;
      }
    }
  </style>
</head>

<body>
  <!--  Body Wrapper -->
  <div id="app">
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
      data-sidebar-position="fixed" data-header-position="fixed">
      <!-- Sidebar Start -->
      <aside class="left-sidebar">
        <!-- Sidebar scroll-->
        <div>
          <div class="brand-logo d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
              <a href="/" class="text-nowrap logo-img me-2">
                <img src="/static/imgs/vf_logo.png" alt="" style="height:32px;width:auto;" />
              </a>
              <span class="fw-bold fs-5 d-inline-block">直播回放後台</span>
            </div>
            <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
              <i class="ti ti-x fs-8"></i>
            </div>
          </div>
          <!-- Sidebar navigation-->
          <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
            <ul id="sidebarnav">
              <li class="nav-small-cap">
                <i class="ti ti-dots nav-small-cap-icon fs-6"></i>
                <span class="hide-menu">首頁</span>
              </li>
              <li class="sidebar-item">
                <a class="sidebar-link" aria-expanded="false">
                  <span>
                    <iconify-icon icon="solar:home-smile-bold-duotone" class="fs-6"></iconify-icon>
                  </span>
                  <span class="hide-menu">回放清單</span>
                </a>
              </li>
          </nav>
          <!-- End Sidebar navigation -->
        </div>
        <!-- End Sidebar scroll-->
      </aside>
      <!--  Sidebar End -->
      <!--  Main wrapper -->
      <div class="body-wrapper">
        <!--  Header Start -->
        <header class="app-header">
          <nav class="navbar navbar-expand-lg navbar-light">
            <ul class="navbar-nav">
              <li class="nav-item d-block d-xl-none">
                <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" href="javascript:void(0)">
                  <i class="ti ti-menu-2"></i>
                </a>
              </li>
            </ul>
            <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
              <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                <li class="nav-item dropdown">
                  <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <iconify-icon icon="ph:user-circle-light" width="35" height="35" class="rounded-circle"></iconify-icon>
                  </a>
                  <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                    <div class="message-body">
                      <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                        <i class="ti ti-user fs-6"></i>
                        <p class="mb-0 fs-3">rolence0515@gmail.com</p>
                      </a>
                      <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">登出</a>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </header>
        <!--  Header End -->
        <div class="container-fluid">
          <div class="card">
            <div class="card-body">
              <div class="row align-items-center g-2">
                <div class="col-3 col-md-2 text-center">
                  <img src="/static/assets/images/backgrounds/product-tip.png" alt="image" class="img-fluid"
                    style="max-width:80px;" />
                </div>
                <div class="col-9 col-md-10">
                  <h4 class="mb-2">感謝你購買聯票，歡迎回到直播回放後台</h4>
                  <p class="mb-0 ">每一場直播都是未來的線索，歡迎你隨時回到這裡回看、整理、內化，創造屬於你自己的新人生腳本
                    ✨</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <!-- 直播回放清單列表 Start -->
              <h5 class="card-title fw-semibold mb-4">直播回放清單列表</h5>
              <div class="table-responsive">
                <table class="table text-nowrap align-middle mb-0">
                  <thead>
                    <tr class="border-2 border-bottom border-primary border-0">
                      <th scope="col" class="ps-0">聯票</th>
                      <th scope="col">標題</th>
                      <th scope="col" class="text-center">講座回放期限</th>
                      <th scope="col" class="text-center d-none d-sm-table-cell sticky-play-mobile-th">播放</th>
                    </tr>
                  </thead>
                  <tbody class="table-group-divider">
                    <tr v-for="(item, idx) in videoList" :key="idx">
                      <td>[[ item.session ]]</td>
                      <td>[[ item.title ]]</td>
                      <td class="text-center">[[ item.period ]]</td>
                      <td class="text-center sticky-play-mobile">
                        <button class="btn btn-sm btn-outline-primary play-vimeo" @click="openVimeo(item.vimeoUrl)">觀看回放
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!-- 直播回放清單列表 End -->
            </div>
          </div>
          <div class="py-6 px-6 text-center">
            <p class="mb-0 fs-5">© 2025 雙生紫焰 直播回放後台｜僅供聯票購買觀眾使用</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="/static/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/assets/libs/simplebar/dist/simplebar.js"></script>
  <script src="/static/assets/js/sidebarmenu.js"></script>
  <script src="/static/assets/js/app.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

  <!-- Vimeo Modal -->
  <div class="modal fade" id="vimeoModal" tabindex="-1" aria-labelledby="vimeoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="vimeoModalLabel">講座回放</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="ratio ratio-16x9">
            <iframe id="vimeoPlayer" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  let app = new Vue({
      el: '#app',
      delimiters: ['[[', ']]'],
      data() {
          return {
              videoList: [
                  { session: '上半場', title: '新紀元超個人經濟學', period: '2025/05/16 ~ 2025/05/25', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
                  { session: '上半場', title: '掌握 AI 時代的應對之道', period: '2025/06/20 ~ 2025/06/29', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
                  { session: '上半場', title: '九紫離火時代生存指南', period: '2025/07/18 ~ 2025/07/27', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
                  { session: '下半場', title: '超腦駭客翻轉衰老祕法', period: '2025/08/15 ~ 2025/08/24', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
                  { session: '下半場', title: '超秘術：生命區塊鏈', period: '2025/09/19 ~ 2025/09/28', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
                  { session: '下半場', title: '未來人類最強『空實力』', period: '2025/10/17 ~ 2025/10/26', vimeoUrl: 'https://player.vimeo.com/video/123456789' },
              ],
              vimeoModal: null,
              vimeoPlayer: null,
          };
      },
      mounted() {
          this.vimeoModal = new bootstrap.Modal(document.getElementById('vimeoModal'));
          this.vimeoPlayer = document.getElementById('vimeoPlayer');
          document.getElementById('vimeoModal').addEventListener('hidden.bs.modal', () => {
              this.vimeoPlayer.src = '';
          });
      },
      methods: {
          openVimeo(url) {
              this.vimeoPlayer.src = url + '?autoplay=1';
              this.vimeoModal.show();
          }
      }
  });
  </script>
</body>

</html>
