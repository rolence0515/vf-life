<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理員後台</title>
  <!-- Favicon for all devices -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon/android-chrome-512x512.png">
  <link rel="manifest" href="/static/favicon/site.webmanifest">
  <link rel="mask-icon" href="/static/favicon/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="/static/favicon/favicon.ico">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-TileImage" content="/static/favicon/mstile-150x150.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/static/assets/css/styles.min.css" />
  <style>
    [v-cloak] { display: none; }
    html, body, #app, .page-wrapper, .body-wrapper, .container-fluid { height: 100%; min-height: 100vh; }
    .body-wrapper { display: flex; flex-direction: column; min-height: 100vh; background: #f7fafd; }
    .container-fluid { flex: 1 0 auto; display: flex; flex-direction: column; }
    .card { flex-shrink: 0; }
    .py-6.px-6.text-center { margin-top: auto; }
  </style>
</head>
<body>

  <div id="app" v-cloak>
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
      <!-- Sidebar Start -->
      <aside class="left-sidebar">
        <div>
          <div class="brand-logo d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
              <a href="/" class="text-nowrap logo-img me-2">
                <img src="/static/imgs/vf_logo.png" alt="" style="height:32px;width:auto;" />
              </a>
              <span class="fw-bold fs-5 d-inline-block">管理員後台</span>
            </div>
            <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
              <i class="ti ti-x fs-8"></i>
            </div>
          </div>
          <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
            <ul id="sidebarnav">
              <li class="nav-small-cap">
                <i class="ti ti-dots nav-small-cap-icon fs-6"></i>
                <span class="hide-menu">資料模組</span>
              </li>
              <li class="sidebar-item">
                <a href="{{ url_for('admin.admin_user') }}" class="sidebar-link">
                  <span>使用者列表</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>
      <!-- Sidebar End -->
      <div class="body-wrapper">
        <!-- Header Start -->
        <header class="app-header">
          <nav class="navbar navbar-expand-lg navbar-light">
            <ul class="navbar-nav">
              <li class="nav-item d-block d-xl-none">
                <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" href="javascript:void(0)">
                  <i class="ti ti-menu-2"></i>
                </a>
              </li>
            </ul>
            <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
              <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                <li class="nav-item dropdown">
                  <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown" aria-expanded="false">
                    <iconify-icon icon="ph:user-circle-light" width="35" height="35" class="rounded-circle"></iconify-icon>
                  </a>
                  <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                    <div class="message-body">
                      <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                        <i class="ti ti-user fs-6"></i>
                        <p class="mb-0 fs-3">sample@email.com</p>
                      </a>
                      <a href="/change-password" class="d-flex align-items-center gap-2 dropdown-item">
                        <i class="ti ti-key fs-6"></i>
                        <p class="mb-0 fs-3">修改密碼</p>
                      </a>
                      <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">登出</a>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </header>
        <!-- Header End -->
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>
  <script src="/static/assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="/static/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/assets/libs/simplebar/dist/simplebar.js"></script>
  <script src="/static/assets/js/sidebarmenu.js"></script>
  <script src="/static/assets/js/app.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
  {% block vue_scripts %}{% endblock %}
</body>
</html>
