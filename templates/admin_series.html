{% extends "admin_base.html" %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <h4 class="mb-2">影片系列表 (series)</h4>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>名稱</th>
            <th>說明</th>
            <th>建立日期</th>
            <th>修改日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="series in pageData.seriesList" :key="series.id">
            <td>[[ series.id ]]</td>
            <td>[[ series.name ]]</td>
            <td>[[ series.description ]]</td>
            <td>[[ series.created_at ]]</td>
            <td>[[ series.updated_at ]]</td>
            <td>
              <button class="btn btn-sm btn-primary">編輯</button>
              <button class="btn btn-sm btn-danger">刪除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="py-6 px-6 text-center">
    <p class="mb-0 fs-5">© 2025 雙生紫焰 管理員後台｜僅供網站管理員使用</p>
  </div>
</div>
<script>
  function extendVue(app) {
    app.pageData = {
      seriesList: [
        { id: 1, name: '系列A', description: '描述A', created_at: '2025-01-01', updated_at: '2025-01-02' },
        { id: 2, name: '系列B', description: '描述B', created_at: '2025-02-01', updated_at: '2025-02-02' }
      ]
    };
  }
</script>
{% endblock %}
