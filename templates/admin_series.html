{% extends "admin_base.html" %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <!-- Removed the right-side form and its container to free up space -->
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-2">影片系列管理</h4>
        </div>
        <div class="card-body">
          <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-success" @click="resetForm" data-bs-toggle="modal" data-bs-target="#seriesModal">
              新增系列
            </button>
          </div>
          <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>名稱</th>
                <th>描述</th>
                <th>影片數量</th>
                <th>建立日期</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="series in seriesList" :key="series.id">
                <td>[[ series.id ]]</td>
                <td>[[ series.name ]]</td>
                <td>[[ series.description ]]</td>
                <td>[[ series.video_count ]]</td>
                <td>[[ series.created_at ]]</td>
                <td>
                  <button class="btn btn-sm btn-primary" @click="editItem(series)" data-bs-toggle="modal" data-bs-target="#seriesModal">編輯</button>
                  <button class="btn btn-sm btn-danger" @click="deleteItem(series.id)">刪除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="py-6 px-6 text-center">
    <p class="mb-0 fs-5">© 2025 雙生紫焰 管理員後台｜僅供網站管理員使用</p>
  </div>
</div>

<div class="modal fade" id="seriesModal" tabindex="-1" aria-labelledby="seriesModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="seriesModalLabel">[[ formTitle ]]</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form @submit.prevent="submitForm">
            <div class="mb-3">
              <label for="name" class="form-label">名稱</label>
              <input type="text" class="form-control" id="name" v-model="formData.name" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">描述</label>
              <textarea class="form-control" id="description" v-model="formData.description" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">儲存</button>
            <button type="button" class="btn btn-secondary" @click="resetForm" data-bs-dismiss="modal">取消</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block vue_scripts %}
<script>
  new Vue({
    el: '#app',
    delimiters: ['[[', ']]'],
    data: {
      seriesList: [],
      formData: {},
      formTitle: '',
      showEdit: false
    },
    mounted() {
      this.fetchSeries();
      // 監聽 modal 關閉事件，自動移除 modal 內的 alert
      const modalEl = document.getElementById('seriesModal');
      if (modalEl) {
        modalEl.addEventListener('hidden.bs.modal', () => {
          this.removeModalAlerts();
        });
      }
    },
    methods: {
      fetchSeries() {
        fetch('/admin/api/series')
          .then(res => res.json())
          .then(data => {
            if (data.success) this.seriesList = data.series;
          });
      },
      editItem(series) {
        this.formData = { ...series };
        this.formTitle = '編輯系列';
        this.showEdit = true;
        $('#seriesModal').modal('show');
      },
      deleteItem(id) {
        if (!confirm('確定要刪除這個系列嗎？')) return;
        fetch(`/admin/api/series/${id}`, { method: 'DELETE' })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              this.fetchSeries();
              this.showAlert(data.msg || '刪除成功', true, false);
            } else {
              this.showAlert(data.msg || '刪除失敗', false, false);
            }
          });
      },
      submitForm() {
        if (!this.formData.name) return this.showAlert('系列名稱不可為空', false, true);
        if (this.formData.id) {
          // 編輯
          fetch(`/admin/api/series/${this.formData.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.formData.name, description: this.formData.description })
          })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                this.fetchSeries();
                this.resetForm();
                $('#seriesModal').modal('hide');
                setTimeout(() => {
                  this.showAlert(data.msg || '更新成功', true, false);
                }, 350);
              } else {
                this.showAlert(data.msg || '更新失敗', false, true);
              }
            });
        } else {
          // 新增
          fetch('/admin/api/series', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.formData.name, description: this.formData.description })
          })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                this.fetchSeries();
                this.resetForm();
                $('#seriesModal').modal('hide');
                setTimeout(() => {
                  this.showAlert(data.msg || '新增成功', true, false);
                }, 350);
              } else {
                this.showAlert(data.msg || '新增失敗', false, true);
              }
            });
        }
      },
      showAlert(msg, isSuccess = true, inModal = true) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${isSuccess ? 'success' : 'danger'} alert-dismissible fade show`;
        alertDiv.role = 'alert';
        alertDiv.innerHTML = msg +
          '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
        if (inModal) {
          const modalBody = document.querySelector('#seriesModal .modal-body');
          if (modalBody) {
            modalBody.prepend(alertDiv);
            // 綁定 modal 關閉時自動移除 alert
            const modalEl = document.getElementById('seriesModal');
            if (modalEl) {
              const removeModalAlerts = () => {
                modalBody.querySelectorAll('.alert').forEach(a => a.remove());
              };
              if (!modalEl._alertCleanupBound) {
                modalEl.addEventListener('hidden.bs.modal', removeModalAlerts);
                modalEl._alertCleanupBound = true;
              }
            }
            return;
          }
        }
        // fallback: 插入到主頁面表格上方
        const cardBody = document.querySelector('.card-body');
        if (cardBody) {
          cardBody.prepend(alertDiv);
        }
      },
      removeModalAlerts() {
        const modalBody = document.querySelector('#seriesModal .modal-body');
        if (modalBody) {
          const alerts = modalBody.querySelectorAll('.alert');
          alerts.forEach(alert => alert.remove());
        }
      },
      resetForm() {
        this.formData = {};
        this.formTitle = '新增系列';
        this.showEdit = false;
      }
    }
  });
</script>
{% endblock %}
