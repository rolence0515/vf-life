{% extends "admin_base.html" %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <h4 class="mb-2">管理員會員關聯表 (admin_users)</h4>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>使用者ID</th>
            <th>建立日期</th>
            <th>修改日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="admin in pageData.adminUsersList" :key="admin.id">
            <td>[[ admin.id ]]</td>
            <td>[[ admin.user_id ]]</td>
            <td>[[ admin.created_at ]]</td>
            <td>[[ admin.updated_at ]]</td>
            <td>
              <button class="btn btn-sm btn-primary">編輯</button>
              <button class="btn btn-sm btn-danger">刪除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
  function extendVue(app) {
    app.pageData = {
      adminUsersList: [
        { id: 1, user_id: 1, created_at: '2025-01-01', updated_at: '2025-01-02' },
        { id: 2, user_id: 2, created_at: '2025-02-01', updated_at: '2025-02-02' }
      ]
    };
  }
</script>
{% endblock %}
